<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="tableau-graphql-mcp banner">
