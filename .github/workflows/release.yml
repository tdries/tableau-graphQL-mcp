name: Release

# Tag a version (vX.Y.Z) to build once, publish to PyPI via Trusted Publishing (OIDC, with
# PEP 740 attestations), then cut a GitHub Release carrying the same files, their Sigstore
# signatures (*.sigstore.json) and a CycloneDX SBOM.
# Requires a PyPI project + a configured trusted publisher for this repo/workflow.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false   # a release build must not restore a (poisonable) cache
      - run: uv build
      # Kept out of dist/: the PyPI upload rejects anything that isn't a wheel or sdist.
      - run: mkdir sbom && uv export --locked --format cyclonedx1.5 --no-dev -o "sbom/tableau-graphql-mcp-${GITHUB_REF_NAME#v}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/
            sbom/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for Trusted Publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.2 (Twine 7 accepts Metadata-Version 2.5)

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # keyless Sigstore signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz ./sbom/*.cdx.json
          upload-signing-artifacts: false
          release-signing-artifacts: false
      # The runner's own gh CLI: no third-party action holds the contents:write token.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* sbom/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
