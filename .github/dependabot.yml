version: 2
updates:
  # uv.lock pins every package by hash; track it directly (pip would only see pyproject.toml).
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    # Supply-chain guard: skip releases younger than a week. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  # One grouped PR, so actions that must move together (e.g. CodeQL init/analyze) do.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
